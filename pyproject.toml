[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "conflux-weave"
version = "0.0.1"
description = "Evidence-native runtime for a local-first research agent workbench"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Conflux-Weave contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "pypdf>=5,<7",
  "python-dotenv>=1,<2",
  "uvicorn>=0.34,<1",
]

[project.scripts]
conflux-weave = "conflux_weave.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/conflux_weave"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
